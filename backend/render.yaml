databases:
  - name: pashuchara-db
    plan: free
    databaseName: pashuchara_db
    user: pashuchara

services:
  - type: web
    name: pashuchara-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: OPENWEATHER_KEY
        sync: false
      - key: DB_NAME
        fromDatabase:
          name: pashuchara-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: pashuchara-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: pashuchara-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: pashuchara-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: pashuchara-db
          property: port
